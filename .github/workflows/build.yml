name: Build Android APK
on:
  workflow_dispatch:

jobs:
  build:
    # 🎯 هنا السر: إجبار جيتهاب على استخدام السيرفر المستقر القديم لمنع مشاكل الأمان
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake libffi-dev build-essential

      - name: Install Build Tools
        run: |
          python -m pip install --upgrade pip
          pip install --break-system-packages "cython<3.0.0" wheel "kivy>=2.2.0" buildozer

      - name: Build Android APK
        run: |
          # بناء مباشر بدون أي أوامر إضافية قد تسبب مشاكل
          yes | buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: bin/*.apk
