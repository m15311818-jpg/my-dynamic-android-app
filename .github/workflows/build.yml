name: Build Fast Android APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Native Android Micro-Packager
        run: |
          npm install -g native-run cordova

      - name: Create Lightning Fast WebView App
        run: |
          cordova create myapp org.test.dynamicapp "My Dynamic App"
          cd myapp
          cordova platform add android
          # 🎯 تم وضع رابط حسابك الصحيح هنا مباشرة
          echo '<meta http-equiv="refresh" content="0;url=https://github.io">' > www/index.html
          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: myapp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
