name: Build Android APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake libffi-dev build-essential

      - name: Install Stable Build Tools (Force Bypass)
        run: |
          python -m pip install --upgrade pip
          # إجبار النظام على التثبيت وتخطي قيود الأمان لجيتهاب
          pip install --break-system-packages "cython<3.0.0" wheel "kivy>=2.2.0" buildozer

      - name: Clean and Build Final APK
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          buildozer clean
          yes | buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: bin/*.apk
