name: Build Dynamic Android APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create Native WebView App Code
        run: |
          # 1. إنشاء الفولدرات مباشرة
          mkdir -p app/src/main/java/com/dynamic/app
          
          # 2. ملف الـ Manifest الأصلي
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://android.com" package="com.dynamic.app">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:theme="@android:style/Theme.NoTitleBar.Fullscreen" android:label="My Dynamic App" android:usesCleartextTraffic="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 3. كود الجافا الصافي اللي بيفتح شاشتك الزرقاء
          cat << 'EOF' > app/src/main/java/com/dynamic/app/MainActivity.java
          package com.dynamic.app;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView webView = new WebView(this);
                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setDomStorageEnabled(true);
                  webView.setWebViewClient(new WebViewClient());
                  // 🔗 الرابط السحري الصافي محقون في قلب النظام
                  webView.loadUrl("https://github.io");
                  setContentView(webView);
              }
          }
          EOF

          # 4. ملفات البناء الرسمية لـ Gradle
          cat << 'EOF' > build.gradle
          plugins { id 'com.android.application' version '8.1.0' }
          android {
              namespace 'com.dynamic.app'
              compileSdk 33
              defaultConfig { applicationId "com.dynamic.app"; minSdk 21; targetSdk 33; versionCode 1; versionName "1.0" }
          }
          EOF
          
          cat << 'EOF' > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          include ':app'
          EOF

      - name: Build Android APK with Pre-Installed Gradle
        run: |
          # قبول التراخيص باستخدام الـ SDK المدمج في جيتهاب
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          # بناء فوري مباشر بأدوات السيرفر
          gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: app/build/outputs/apk/debug/*.apk
