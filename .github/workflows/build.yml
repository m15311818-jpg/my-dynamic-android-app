name: Build Android APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (Bypass Error 100)
        run: |
          # إجبار النظام على تخطي أي سيرفر تحديثات ساقط ومتابعة التثبيت بأمان
          sudo apt-get update || true
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake libffi-dev build-essential || true

      - name: Install Stable Build Tools
        run: |
          python -m pip install --upgrade pip
          pip install --break-system-packages "cython<3.0.0" wheel "kivy>=2.2.0" buildozer

      - name: Build Android APK
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          yes | buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: bin/*.apk
