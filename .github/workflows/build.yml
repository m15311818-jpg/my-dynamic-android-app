name: Build Fast Android APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Native Android Micro-Packager
        run: |
          npm install -g native-run cordova

      - name: Create Lightning Fast WebView App
        run: |
          cordova create myapp org.test.dynamicapp "My Dynamic App"
          cd myapp
          cordova platform add android
          
          # 🎯 التعديل الذهبي: حقن رابط صفحتك الزرقاء مباشرة في ملف الإعدادات الأصلي للتطبيق
          # هذا يجبر نظام الأندرويد على فتح صفحتك فوراً كأنها قلب التطبيق بدون وسيط
          sed -i 's|<content src="index.html" />|<content src="https://github.io" /><allow-navigation href="*" />|g' config.xml
          
          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: myapp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
